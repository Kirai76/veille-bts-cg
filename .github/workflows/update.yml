name: Mise à jour du site

on:
  schedule:
    - cron: "17 * * * *"   # toutes les heures, à la minute 17
  workflow_dispatch:         # bouton "Run workflow" pour lancer à la main
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collecter les actualités et construire le site
        run: python3 scripts/build.py

      - name: Enregistrer les nouveaux articles dans le dépôt
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Actualités du $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
